---
- name: Install dependencies to connect the repository
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create a directory for apt keys (keyrings)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download and add the Docker repository GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  register: docker_key_download
  until: docker_key_download is succeeded
  retries: 3
  delay: 5

- name: Add the Docker repository to apt sources
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker

- name: Install containerd
  apt:
    name: containerd.io
    state: present
    update_cache: yes

- name: Create a directory for the containerd config
  file:
    path: /etc/containerd
    state: directory

- name: Deploy containerd config from template
  template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Перезапустить containerd

- name: Containerd is running and enabled for autostart
  systemd:
    name: containerd
    state: started
    enabled: true

- name: Download crictl
  get_url:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
    dest: /tmp/crictl.tar.gz

- name: Install crictl
  unarchive:
    src: /tmp/crictl.tar.gz
    dest: /usr/local/bin
    remote_src: true
    mode: '0755'
  register: crictl_download
  until: crictl_download is succeeded
  retries: 3
  delay: 5

- name: Config for crictl
  copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
