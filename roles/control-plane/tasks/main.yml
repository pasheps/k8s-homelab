- name: Инициализировать Kubernetes
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Создать директорию .kube
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Копировать конфиг к пользователю
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Установть pip3
  apt:
    name: python3-pip
    state: present
    update_cache: yes

- name: Установить Python-библиотеку kubernetes
  pip:
    name: kubernetes
    state: present
    extra_args: --break-system-packages

- name: Скачать манифест flannel
  get_url:
    url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    dest: /tmp/kube-flannel.yml

- name: Применение манифеста flannel
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    state: present
    src: /tmp/kube-flannel.yml

- name: Указать Flannel использовать правильный сетевой интерфейс
  kubernetes.core.k8s_json_patch:
    kind: DaemonSet
    name: kube-flannel-ds
    namespace: kube-flannel
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    patch:
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--iface=enp0s8"
