- name: Initialize Kubernetes
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Create a .kube directory
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy config to user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Install pip3
  apt:
    name: python3-pip
    state: present
    update_cache: yes

- name: Install the kubernetes Python-library
  pip:
    name: kubernetes
    state: present
    extra_args: --break-system-packages

- name: Download the flannel manifest
  get_url:
    url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    dest: /tmp/kube-flannel.yml

- name: Apply the flannel manifest
  kubernetes.core.k8s:
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    state: present
    src: /tmp/kube-flannel.yml

- name: Tell Flannel to use the correct network interface
  kubernetes.core.k8s_json_patch:
    kind: DaemonSet
    name: kube-flannel-ds
    namespace: kube-flannel
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    patch:
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--iface=enp0s8"
